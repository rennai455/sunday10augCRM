name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Optional sanity; do not fail the build for lint/tests yet to avoid blocking
      - name: Lint (non-blocking)
        run: npm run -s lint || true

      - name: Show package versions
        run: |
          node -v
          npm -v

