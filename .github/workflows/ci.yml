name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint (focused)
        run: npx eslint src/auth.js src/middleware.js src/routes.js server.js public/scripts/pages/login.js service-worker.js

      - name: Test
        env:
          NODE_ENV: test
        run: npm test --silent

      - name: Audit (prod deps)
        run: npm audit --omit=dev

      - name: Smoke diagnostics (skip API)
        env:
          NODE_ENV: test
        run: node scripts/diagnostics.js --skip-api
